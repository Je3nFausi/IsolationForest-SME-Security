{% extends "base.html" %}
{% block title %}Settings - BI-Safe{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1 data-typewriter>Settings</h1>
        <p>Manage your account preferences</p>
    </div>
</div>

<div class="card">
    <div class="card-header"><h2>👤 Account Information</h2></div>
    <div class="form-group">
        <label>Name</label>
        <input type="text" value="{{ user.name }}" readonly>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" value="{{ user.email }}" readonly>
    </div>
    <div class="form-group">
        <label>Phone</label>
        <input type="tel" value="{{ user.phone }}" readonly>
    </div>
    <div class="form-group">
        <label>Role</label>
        <input type="text" value="{{ user.role }}" readonly>
    </div>
</div>

<div class="card">
    <div class="card-header"><h2>🔔 Notification Preferences</h2></div>
    <div class="form-group">
        <label style="display: flex; align-items: center; gap: 10px; text-transform: none;">
            <input type="checkbox" checked style="width: auto;"> SMS Alerts
        </label>
    </div>
    <div class="form-group">
        <label style="display: flex; align-items: center; gap: 10px; text-transform: none;">
            <input type="checkbox" checked style="width: auto;"> WhatsApp Alerts
        </label>
    </div>
    <div class="form-group">
        <label style="display: flex; align-items: center; gap: 10px; text-transform: none;">
            <input type="checkbox" style="width: auto;"> Email Alerts
        </label>
    </div>
    <button class="btn btn-primary" onclick="showToast('✅ Settings saved', 'success')">💾 Save Settings</button>
</div>

<div class="card">
    <div class="card-header"><h2>🔒 Security</h2></div>
    <div class="form-group">
        <label for="current_password">Current Password</label>
        <input type="password" id="current_password" placeholder="Enter current password">
    </div>
    <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" placeholder="At least 6 characters">
    </div>
    <button class="btn btn-primary" onclick="showToast('🔒 Password updated', 'success')">🔒 Update Password</button>
</div>
{% endblock %}
