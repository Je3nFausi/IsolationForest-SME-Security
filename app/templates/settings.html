{% extends "base.html" %}
{% block title %}Settings - BI-Safe{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Account Settings</h1>
        <p>Manage your profile and security preferences.</p>
    </div>
</div>

<div style="background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(44, 30, 22, 0.04); max-width: 600px;">
    <div class="form-group">
        <label>Full Name</label>
        <input type="text" value="{{ session.user.name }}" disabled style="background: #f9f9f9; color: #888;">
    </div>
    <div class="form-group">
        <label>Email Address</label>
        <input type="email" value="{{ session.user.email }}" disabled style="background: #f9f9f9; color: #888;">
    </div>
    <div class="form-group">
        <label>Business Type</label>
        <input type="text" value="{{ session.user.sme_type or 'Not specified' }}" disabled style="background: #f9f9f9; color: #888;">
    </div>
    <p style="font-size: 13px; color: var(--muted); margin-top: 20px;">To change these details, please contact the system administrator.</p>
</div>
{% endblock %}
