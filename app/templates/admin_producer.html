{% extends "base.html" %}
{% block title %}Producer - Admin{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1 data-typewriter>Producer</h1>
        <p>Manage the network traffic simulation</p>
    </div>
</div>

<div class="card">
    <div class="card-header"><h2>🎛️ Producer Control</h2></div>
    <div class="stats-grid">
        <div>
            <div class="stat-card-label">Status</div>
            <div class="stat-card-value green" style="font-size: 22px;">Running</div>
        </div>
        <div>
            <div class="stat-card-label">Rate</div>
            <div class="stat-card-value" style="font-size: 22px;">10/sec</div>
        </div>
        <div>
            <div class="stat-card-label">Events</div>
            <div class="stat-card-value" style="font-size: 22px;">0</div>
        </div>
    </div>
    <div class="btn-group">
        <button class="btn btn-success" onclick="producerAction('start')">▶️ Start</button>
        <button class="btn btn-warning" onclick="producerAction('pause')">⏸️ Pause</button>
        <button class="btn btn-danger" onclick="producerAction('stop')">⏹️ Stop</button>
    </div>
</div>

{% block extra_scripts %}
<script>
    async function producerAction(action) {
        try {
            const res = await fetch(`/api/producer/${action}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                const colorMap = { running: '#10b981', paused: '#f59e0b', stopped: '#ef4444' };
                const icons = { running: '✅', paused: '⏸️', stopped: '⛔' };
                const el = document.getElementById('producer-status-display');
                if (el) {
                    el.textContent = `${icons[data.status]} ${data.status.charAt(0).toUpperCase() + data.status.slice(1)}`;
                    el.style.color = colorMap[data.status];
                }
                alert(`✅ Producer ${data.status}`);
            }
        } catch (err) {
            alert('❌ Network error');
        }
    }
</script>

{% endblock %}
